<script>
/* 網頁版：模型以文字分塊載入，再喺瀏覽器砌返做 GLB */
window.__modelReady = (async () => {
  try {
    const N = 6;
    const texts = await Promise.all(Array.from({length: N}, async (_, i) => {
      const r = await fetch('model_b64_' + i + '.txt');
      if (!r.ok) throw new Error('part ' + i + ' HTTP ' + r.status);
      return r.text();
    }));
    let size = 0;
    const bins = texts.map(t => { const s = atob(t); size += s.length; return s; });
    const bytes = new Uint8Array(size);
    let off = 0;
    for (const s of bins) { for (let i = 0; i < s.length; i++) bytes[off++] = s.charCodeAt(i); }
    return URL.createObjectURL(new Blob([bytes], {type: 'model/gltf-binary'}));
  } catch (e) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:99;background:#a33;color:#fff;padding:10px 14px;border-radius:10px;font:14px sans-serif';
    d.textContent = '模型載入失敗，請重新整理再試（' + e.message + '）';
    document.body.appendChild(d);
    throw e;
  }
})();
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ================================================================
   花喵喵模擬器 v1 — 3D 公仔風貓生活模擬（Nelson 個人用）
   藍圖：DESIGN.md（2026-11-23 拷問定案）
   ================================================================ */

const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rand = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const TAU = Math.PI*2;
function damp(cur,target,lambda,dt){ return THREE.MathUtils.damp(cur,target,lambda,dt); }
function dampAngle(cur,target,lambda,dt){
  let d = ((target-cur+Math.PI)%TAU+TAU)%TAU-Math.PI;
  return cur + d*(1-Math.exp(-lambda*dt));
}

/* ---------------- 存檔 ---------------- */
const SAVE_KEY = 'hmm_sim_v1';
let SAVE = { affection:0, dress:{collar:'pink', bow:false, hat:false, scarf:false, glasses:false},
             muted:false, dayMode:'auto', meters:null, album: [], diary: null };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s==='object') SAVE = Object.assign(SAVE, s); } catch(e){}
function persist(){ try { SAVE.meters = { hunger:S.hunger, energy:S.energy, mood:S.mood }; localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){} }
/* ---------------- 今日日記 ---------------- */
function diaryDayStr(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function diary(txt){
  const today = diaryDayStr();
  if (!SAVE.diary || SAVE.diary.day !== today) SAVE.diary = { day: today, lines: [] };
  const lines = SAVE.diary.lines, now = Date.now();
  if (lines.length && lines[lines.length-1].txt === txt && now - lines[lines.length-1].ts < 120000) return; // 兩分鐘內同一件事唔好重複記
  const d = new Date();
  lines.push({ ts: now, t: `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, txt });
  if (lines.length > 60) lines.splice(0, lines.length - 60);
  persist();
}

/* ---------------- 狀態 ---------------- */
const S = {
  hunger: SAVE.meters?.hunger ?? 75, energy: SAVE.meters?.energy ?? 82, mood: SAVE.meters?.mood ?? 70,
  affection: SAVE.affection || 0,
  activity: 'idle', actT: 0, actDur: 2, target: null, path: [],
  toyMode: null,          // 'laser' | 'wand' | null
  camHold: false,
  fetchToy: null,         // {kind:'ball'|'mouse', phase:...}
  followCam: false, sleeping: false, riding: false,
  petStreak: 0, lastPetPart: null, calledAt: 0,
};
const affectionLv = ()=> 1 + Math.floor(S.affection/60);

/* ---------------- 音訊（合成；watchdog+重建，iOS 防啞 — 沿用兩隻教學遊戲驗證過嘅做法） ---------------- */
let AC = null, masterGain = null, purrNodes = null;
function newAudioCtx(){ try { return new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; } }
function ensureAudio(){
  if (!AC) { AC = newAudioCtx(); if (AC){ masterGain = AC.createGain(); masterGain.gain.value = SAVE.muted?0:0.9; masterGain.connect(AC.destination); } }
  if (AC && AC.state !== 'running') AC.resume().catch(()=>{});
  return AC;
}
function resumeAudio(){ ensureAudio(); }
['pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev, resumeAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resumeAudio(); });
window.addEventListener('focus', resumeAudio); window.addEventListener('pageshow', resumeAudio);
let audioStuck = 0, lastCtxT = 0;
setInterval(()=>{ // watchdog：currentTime 唔郁 3 次就成個 context 換新
  if (!AC || SAVE.muted) return;
  if (AC.state === 'running' && AC.currentTime === lastCtxT) {
    audioStuck++;
    if (audioStuck >= 3) { try{ AC.close(); }catch(e){} AC = null; purrNodes = null; ensureAudio(); audioStuck = 0; }
    else AC.resume().catch(()=>{});
  } else audioStuck = 0;
  if (AC) lastCtxT = AC.currentTime;
}, 500);

function tone(freq0, freq1, dur, type='sine', vol=0.2, when=0){
  if (!ensureAudio() || SAVE.muted) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,freq1), t0+dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseBurst(dur, filterFreq, vol=0.15, when=0, type='bandpass'){
  if (!ensureAudio() || SAVE.muted) return;
  const t0 = AC.currentTime + when;
  const len = Math.max(1, Math.floor(AC.sampleRate*dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = filterFreq; f.Q.value = 0.9;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(f); f.connect(g); g.connect(masterGain); src.start(t0);
}
const sfx = {
  meow(kind=0){
    if (!ensureAudio() || SAVE.muted) return;
    const base = kind===1 ? 620 : kind===2 ? 480 : 540;
    tone(base, base*1.25, 0.16, 'sawtooth', 0.05); tone(base*2, base*2.4, 0.14, 'sine', 0.10);
    tone(base*1.25, base*0.8, 0.30, 'sawtooth', 0.045, 0.13); tone(base*2.4, base*1.5, 0.28, 'sine', 0.09, 0.13);
  },
  chirp(){ tone(880, 1320, 0.09, 'sine', 0.12); tone(1180, 1560, 0.08, 'sine', 0.10, 0.08); },
  bell(){ tone(4200, 3900, 0.07, 'sine', 0.035); tone(5300, 5000, 0.05, 'sine', 0.02, 0.015); },
  crunch(){ for(let i=0;i<3;i++) noiseBurst(0.05, 1800, 0.12, i*0.22); },
  lap(){ for(let i=0;i<4;i++) noiseBurst(0.045, 900, 0.07, i*0.19, 'lowpass'); },
  scratch(){ noiseBurst(0.32, 2600, 0.10); noiseBurst(0.28, 2200, 0.09, 0.36); },
  squeak(){ tone(1250, 1750, 0.08, 'sine', 0.12); },
  pop(){ tone(520, 760, 0.07, 'sine', 0.10); },
  thud(){ noiseBurst(0.09, 240, 0.16, 0, 'lowpass'); },
  purr(on){
    if (!ensureAudio()) return;
    if (on && !purrNodes && !SAVE.muted){
      const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
      o.type='triangle'; o.frequency.value = 52; g.gain.value = 0.0;
      g.gain.setTargetAtTime(0.11, AC.currentTime, 0.25);
      lfo.type='sine'; lfo.frequency.value = 21; lg.gain.value = 0.05;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(masterGain); o.start(); lfo.start();
      purrNodes = {o,g,lfo};
    } else if (!on && purrNodes){
      const p = purrNodes; purrNodes = null;
      p.g.gain.setTargetAtTime(0, AC.currentTime, 0.15);
      setTimeout(()=>{ try{p.o.stop(); p.lfo.stop();}catch(e){} }, 600);
    }
  }
};

/* ---------------- Three 場景 ---------------- */
const container = $('#scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2118);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
const CAM = { theta: 0.62, phi: 1.02, radius: 10.5, tx:0, ty:0.6, tz:-0.4, // 目標同角度（娃娃屋視角）
              cTheta: 0.62, cPhi: 1.02, cRadius: 10.5, cx:0, cy:0.6, cz:-0.4 };
function applyCamera(dt){
  CAM.cTheta = damp(CAM.cTheta, CAM.theta, 6, dt); CAM.cPhi = damp(CAM.cPhi, CAM.phi, 6, dt);
  CAM.cRadius = damp(CAM.cRadius, CAM.radius, 6, dt);
  CAM.cx = damp(CAM.cx, CAM.tx, 5, dt); CAM.cy = damp(CAM.cy, CAM.ty, 5, dt); CAM.cz = damp(CAM.cz, CAM.tz, 5, dt);
  const boost = camera.aspect < 1 ? clamp(1.02/Math.max(camera.aspect, 0.4), 1, 1.5) : 1;
  const R = CAM.cRadius * boost;
  const sp = Math.sin(CAM.cPhi), x = CAM.cx + R*sp*Math.sin(CAM.cTheta);
  const y = CAM.cy + R*Math.cos(CAM.cPhi), z = CAM.cz + R*sp*Math.cos(CAM.cTheta);

  const out=[]; for(let i=0;i<n;i++) out.push(x + w*(i+0.5)/n + Math.sin(i*7.3)*wob); return out;
}

function makeRugTexture(){

}

function safeGroundTarget(x, z){ // 跟機械人／落車落地用：目標收返入可行範圍＋避開傢俬腳印，唔好入牆/入基站塔
  x = clamp(x, -4.95, 4.95); z = clamp(z, -3.95, 4.05);
  for (const o of OBSTACLES){
    const ox = x - o.x, oz = z - o.z, od = Math.hypot(ox, oz), rr = o.r + 0.10;
    if (od < rr){ if (od < 0.001){ x = o.x - rr; z = o.z; } else { x = o.x + ox/od*rr; z = o.z + oz/od*rr; } }
  }
  if (!S.riding){ // 目標唔好同郁動中嘅機械人重疊
    const rp = ROBOT.group.position, ox = x - rp.x, oz = z - rp.z, od = Math.hypot(ox, oz), rr = 0.55;
    if (od < rr){ if (od < 0.001){ x = rp.x - rr; z = rp.z; } else { x = rp.x + ox/od*rr; z = rp.z + oz/od*rr; } }
  }
  return { x: clamp(x, -4.95, 4.95), z: clamp(z, -3.95, 4.05) };
}
function goTo(x, z, onArrive, speedMul=1){
  if (!isFinite(x) || !isFinite(z)) return; // NaN 目標直接丟棄（防消失 bug 復發）
  if (S.riding) return; // 坐緊車：地面指令唔接（落車流程會處理）
  if (CAT.jump){ CAT.pendingGoTo = { x, z, onArrive, speedMul }; return; }
  if (catRoot.position.y > 0.05){ // 喺高處（跳台/紙箱頂）：先跳返落嚟（向房中心方向落，唔好撞牆角），先至行過去
    CAT.pendingGoTo = { x, z, onArrive, speedMul };
    const dx = 0 - catRoot.position.x, dz = 0.5 - catRoot.position.z, dl = Math.hypot(dx, dz) || 1;
    jumpTo(clamp(catRoot.position.x + dx/dl*0.85, -5.1, 5.1), 0,
           clamp(catRoot.position.z + dz/dl*0.85, -4.1, 4.2), CAT.heading, null, 0.22, 0.45);
    return;
  }
  CAT.targetPos = new THREE.Vector3(x, 0, z); CAT.onArrive = onArrive || null; CAT.speedMul = speedMul;
}
function stopMove(){ CAT.targetPos = null; CAT.moving = false; CAT.speed = 0; }
function faceToward(angle, dt){ CAT.heading = dampAngle(CAT.heading, angle, 8, dt); catRoot.rotation.y = CAT.heading; }
function updateMovement(dt){
  if (ZOOM.on && !CAT.jump) return; // 發癲跑由 updateZoomies 全權駕駛（唔好俾待機分支拉停速度/搶方向）
  if (CAT.jump){ // 跳躍中（上跳台/紙箱/機械人）
    const J = CAT.jump; J.t += dt / J.dur;
    const t = Math.min(1, J.t);
    const pt = clamp(t, 0, 1); // t<0 係起跳前轉身階段：位置停喺起點，只轉向
    catRoot.position.lerpVectors(J.from, J.to, pt);
    const shapePt = J.late ? Math.pow(pt, 1.3) : pt; // 上跳：高度曲線推後——過台邊嗰陣仲喺高位，臨到中心先至落，唔好俾身/腳撞台邊
    catRoot.position.y = lerp(J.from.y, J.to.y, pt) + Math.sin(shapePt*Math.PI) * J.arc;
    // 空中面向：前段面向前進方向（面朝去緊嗰度嚟跳）；臨落地先轉返落點朝向——
    // 但如果兩者差太遠（>1.2），成程保持面向前進方向，落到地先用 faceTarget 慢慢轉，唔好空中擰身
    let goal = J.face ?? CAT.heading;
    if (J.trav != null){
      const fd = Math.abs(((goal - J.trav + Math.PI)%TAU+TAU)%TAU - Math.PI);
      if (fd > 0.35 && (J.t < 0 || pt < 0.55 || fd > 1.2)) goal = J.trav;
    }
    CAT.heading = dampAngle(CAT.heading, goal, 8, dt); catRoot.rotation.y = CAT.heading;
    if (t >= 1){ CAT.jump = null; CAT.landT = 0;
      if (!S.riding && J.to.y === 0){ // 落地唔好疊住機械人個盤
        const rp = ROBOT.group.position, cp = catRoot.position;
        const rd = Math.hypot(cp.x - rp.x, cp.z - rp.z);
        if (rd < 0.45 && rd > 0.001){ cp.x = rp.x + (cp.x - rp.x)/rd*0.45; cp.z = rp.z + (cp.z - rp.z)/rd*0.45; }
      }
      if (J.trav != null && J.face != null){
        const fd = Math.abs(((J.face - J.trav + Math.PI)%TAU+TAU)%TAU - Math.PI);
        if (fd > 1.2) CAT.faceTarget = J.face; // 落地後慢慢轉返落點朝向（例如上到跳台先轉返望入房）
      }
      if (J.done) J.done();
      if (CAT.pendingGoTo){ const p = CAT.pendingGoTo; CAT.pendingGoTo = null; goTo(p.x, p.z, p.onArrive, p.speedMul); } }
    CAT.moving = false; return;
  }
  if (S.riding) return; // 坐車嗰陣由機械人帶動
  const tp = CAT.targetPos;
  if (!tp){ CAT.moving = false; CAT.speed = damp(CAT.speed, 0, 8, dt);
    if (CAT.faceTarget != null){ faceToward(CAT.faceTarget, dt);
      if (Math.abs(((CAT.faceTarget - CAT.heading + Math.PI)%TAU+TAU)%TAU - Math.PI) < 0.05) CAT.faceTarget = null; }
    return; }
  const p = catRoot.position;
  const dx = tp.x - p.x, dz = tp.z - p.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.09){
    stopMove(); const cb = CAT.onArrive; CAT.onArrive = null; if (cb) cb(); return;
  }
  const targetAngle = Math.atan2(dx, dz);
  faceToward(targetAngle, dt);
  const angDiff = Math.abs(((targetAngle - CAT.heading + Math.PI)%TAU+TAU)%TAU - Math.PI);
  const sp = (angDiff > 1.2 ? 0.25 : 1.05) * (CAT.speedMul||1);
  CAT.speed = damp(CAT.speed, sp, 6, dt);
  let mx = Math.sin(CAT.heading) * CAT.speed * dt, mz = Math.cos(CAT.heading) * CAT.speed * dt;
  p.x += mx; p.z += mz;
  // 簡單避障：推出障礙圓
  for (const o of OBSTACLES){
    const ox = p.x - o.x, oz = p.z - o.z, od = Math.hypot(ox, oz);
    if (od < o.r && od > 0.001){ p.x = o.x + ox/od*o.r; p.z = o.z + oz/od*o.r; }
  }
  // 機械人係郁動障礙（唔係騎緊嗰陣）：唔好行穿佢個盤
  if (!S.riding){
    const rp = ROBOT.group.position, rox = p.x - rp.x, roz = p.z - rp.z, rod = Math.hypot(rox, roz);
    if (rod < 0.45 && rod > 0.001){ p.x = rp.x + rox/rod*0.45; p.z = rp.z + roz/rod*0.45; }
  }
  p.x = clamp(p.x, -5.15, 5.15); p.z = clamp(p.z, -4.15, 4.25);
  if (!isFinite(p.x) || !isFinite(p.z) || !isFinite(CAT.heading)){ p.x = 0.6; p.z = 0.9; CAT.heading = 0.4; catRoot.rotation.y = CAT.heading; stopMove(); } // 最後防線：萬一有 NaN 漏入嚟，即刻救返去出生點，唔好俾隻貓消失
  CAT.moving = CAT.speed > 0.12;
  if (CAT.pose !== 'stand' && CAT.moving) CAT.pose = 'stand';
}
function jumpTo(x, y, z, face, done, arc=0.35, dur=0.55, keepFace=false){
  if (y === 0){ x = clamp(x, -5.15, 5.15); z = clamp(z, -4.15, 4.25); } // 落地點唔好出界/入牆
  // 起跳前轉身要對準「前進方向」（唔係落點朝向）：之前成個跳躍都望住落點朝向，
  // 當落點朝向同前進方向相反（上跳台/層架），就會變成向後跳（Nelson 指出）
  const from = catRoot.position.clone();
  const f = face ?? CAT.heading;
  const tdx = x - from.x, tdz = z - from.z;
  const trav = (!keepFace && Math.hypot(tdx, tdz) > 0.12) ? Math.atan2(tdx, tdz) : null; // keepFace＝受驚向後彈嗰種：面向威脅、身體向後，係刻意嘅
  const goal0 = trav ?? f;
  const dAng = Math.abs(((goal0 - CAT.heading + Math.PI)%TAU+TAU)%TAU - Math.PI);
  const turnT = (dAng > 1.15 && (y > 0.05 || from.y > 0.05)) ? Math.min(0.34, dAng * 0.16) : 0;
  // 上跳去高台：弧線自動加高（跟高度差）＋標記 late（updateMovement 會將高度曲線推後），成隻飛過台邊先落，唔好撞邊穿模
  let arcUse = arc, late = false;
  if (y > from.y + 0.05){ arcUse = Math.max(arc, 0.22 + (y - from.y) * 0.42); late = true; }
  CAT.jump = { from, to: new THREE.Vector3(x, y, z), t: -turnT, dur, arc: arcUse, face, done, trav, keepFace, late };
  stopMove();
}

function updateBrain(dt){
  S.actT += dt;
  // 狀態自然變化
  if (S.sleeping){ S.energy = clamp(S.energy + 3.4*dt, 0, 100); S.hunger = clamp(S.hunger - 0.02*dt, 0, 100); }
  else { S.hunger = clamp(S.hunger - 0.055*dt, 0, 100); S.energy = clamp(S.energy - (isNight()?0.02:0.045)*dt, 0, 100); }
  S.mood = clamp(S.mood + (55 - S.mood) * 0.002 * dt, 0, 100);
  if (S.sleeping && S.energy >= 99){ S.zoomieBoost = true; finishActivity(); return; } // 瞓飽醒嚟，好易發癲跑
  // 特別活動嘅持續行為
  if (S.activity === 'robotWatch' || S.activity === 'robotChase'){
    if (ROBOT.state === 'docked'){ finishActivity(); return; } // 機械人返咗基站就唔使再跟（唔好埋去基站角落）
    const rp = ROBOT.group.position, cp = catRoot.position;
    const d = Math.hypot(rp.x-cp.x, rp.z-cp.z);
    CAT.lookYaw = 0; CAT.heading = dampAngle(CAT.heading, Math.atan2(rp.x-cp.x, rp.z-cp.z), 6, dt); catRoot.rotation.y = CAT.heading;
    if (S.activity === 'robotChase' && d > 0.85){ // 追喺車尾 0.7，但目標要安全：唔入牆/傢俬，同車身保持距離
      let st = safeGroundTarget(rp.x - Math.sin(ROBOT.heading)*0.7, rp.z - Math.cos(ROBOT.heading)*0.7);
      const sd = Math.hypot(st.x-rp.x, st.z-rp.z);
      if (sd < 0.5){ st.x = clamp(rp.x + (st.x-rp.x)/(sd||1)*0.5, -4.95, 4.95); st.z = clamp(rp.z + (st.z-rp.z)/(sd||1)*0.5, -3.95, 4.05); }
      goTo(st.x, st.z, null, 1.15);
    }
    else if (S.activity === 'robotWatch' && d > 2.6){ const st = safeGroundTarget(rp.x + rand(-1,1), rp.z + rand(-1,1)); goTo(st.x, st.z, null, 0.8); }
    if (CAT.pose !== 'sit' && !CAT.moving) CAT.pose = 'sit';
  }
  if (S.activity === 'robotRideGo'){
    const rp = ROBOT.group.position, cp = catRoot.position;
    const d = Math.hypot(rp.x-cp.x, rp.z-cp.z);
    if (ROBOT.state !== 'patrol'){ finishActivity(); return; }
    if (d > 0.9){ const st = safeGroundTarget(rp.x + (cp.x-rp.x)/d*0.72, rp.z + (cp.z-rp.z)/d*0.72); goTo(st.x, st.z, null, 1.6); } // 行去車邊 0.72 嘅接近點，唔好踩正車身/衝入基站角
    else { // 跳上車！
      stopMove(); S.riding = true; CAT.pose = 'ride'; setActivity('riding', rand(14, 22)); sfx.chirp(); diary('🚗 坐掃地機械人兜風，威到爆');
    }
  }
  if (S.activity === 'riding'){
    const rp = ROBOT.group.position;
    catRoot.position.set(rp.x, ROBOT.rideY, rp.z);
    CAT.heading = dampAngle(CAT.heading, ROBOT.heading, 5, dt); catRoot.rotation.y = CAT.heading;
    if (ROBOT.state !== 'patrol' || S.actT >= S.actDur){ // 落車
      S.riding = false;
      const dl = safeGroundTarget(rp.x + rand(-0.8,0.8), rp.z + rand(0.4,0.9)); jumpTo(dl.x, 0, dl.z, CAT.heading, ()=>{ CAT.pose='stand'; sfx.thud(); brainThink(); });
      setActivity('jumpingDown', 1.2); S.mood = clamp(S.mood + 8, 0, 100);
    }
    return;
  }
  if (S.activity === 'birdWatching'){
    if (BIRDS.present) S.actT = Math.min(S.actT, S.actDur - 2.5); // 雀仲喺度就繼續望
    const b = BIRDS.list.find(x=>x.visible);
    if (b){ const wp = new THREE.Vector3(); b.getWorldPosition(wp);
      const rel = Math.atan2(wp.x - catRoot.position.x, wp.z - catRoot.position.z) - CAT.heading;
      CAT.lookYaw = clamp(((rel + Math.PI)%TAU+TAU)%TAU - Math.PI, -0.6, 0.6);
    }
    BIRDS.chatterT -= dt;
    if (BIRDS.chatterT <= 0){ BIRDS.chatterT = rand(1.4, 3.4); if (BIRDS.present){ sfx.chirp(); if (Math.random()<0.5) showBubble('咔咔咔…', 900); CAT.earTwitch = 1; } }
  }
  if (S.actT >= S.actDur && !CAT.targetPos && !CAT.jump && S.activity !== 'going') finishActivity();
  else if (S.activity === 'going' && S.actT >= S.actDur){ stopMove(); brainThink(); } // 行唔到就放棄
  else if (S.activity === 'going' && !CAT.targetPos && !CAT.jump){ /* 已到達但 callback 已處理 */ }
  // 抓板動作（喺 pose 更新後補上嘅快速手部擺動，喺主循環處理）
}

/* ---------------- 掃地機械人 AI ---------------- */
ROBOT.heading = Math.PI; ROBOT.nextRun = 10; // 固定時間表：開機 10 秒後第一次出巡
function robotWaypoints(){
  const pts = [];
  const cand = [[-2.5,-2.5],[2.5,-2.2],[-3.5,1.5],[1.5,2.6],[3.8,-0.5],[-1.5,-3.4],[0.5,0.8],[-4.2,-0.8],[2.2,3.4]];
  for(let i=0;i<5;i++){ const c = pick(cand); pts.push({ x: c[0], z: c[1] }); } // 一定要用 {x,z} 物件：updateRobot 讀 tp.x/tp.z，俾陣列會出 NaN（貓消失 bug 嘅根源）
  return pts;
}
function robotStartReturn(){ // 返基站要行「入閘」路線：房心 → 飲水機前閘口 → 後牆 → 基站；直線返去會穿過貓窩（2026-11-23 修）
  ROBOT.state = 'returning'; ROBOT.path = [{x:2.5,z:-2.8,g:true},{x:3.15,z:-3.36,g:true},{x:3.6,z:-3.85,g:true}]; ROBOT.pathI = 0;
}
function updateRobot(dt){
  ROBOT.t += dt;
  const g = ROBOT.group;
  if (ROBOT.state === 'docked'){
    if (ROBOT.t >= ROBOT.nextRun){ ROBOT.state = 'patrol'; ROBOT.t = 0; ROBOT.path = [{x:3.6,z:-3.85,g:true},{x:3.15,z:-3.36,g:true},{x:2.5,z:-2.8,g:true}, ...robotWaypoints()]; ROBOT.pathI = 0; ROBOT.passes = 0; sfx.pop(); } // 出閘：沿後牆出 → 飲水機前穿過 → 出房心（唔好直線穿過貓窩）
    return;
  }
  if (ROBOT.state === 'patrol' || ROBOT.state === 'returning'){
    let tp = ROBOT.state === 'returning' ? (ROBOT.path[ROBOT.pathI] || ROBOT.home) : ROBOT.path[ROBOT.pathI];
    if (!tp){ robotStartReturn(); tp = ROBOT.path[0]; }
    if (!isFinite(tp.x) || !isFinite(tp.z)){ ROBOT.pathI++; return; } // 壞路點即刻跳過，唔俾 NaN 污染 heading
    const dx = tp.x - g.position.x, dz = tp.z - g.position.z, d = Math.hypot(dx, dz);
    if (d < 0.15){
      if (ROBOT.state === 'returning'){
        if (ROBOT.pathI < ROBOT.path.length){ ROBOT.pathI++; return; } // 未到基站，仲喺入閘途中
        ROBOT.state = 'docked'; ROBOT.t = 0; ROBOT.nextRun = 55; g.position.copy(ROBOT.home); return; } // 停 55 秒又出巡（出多啲嚟掃）
      ROBOT.pathI++;
      if (ROBOT.pathI >= ROBOT.path.length){
        ROBOT.passes++;
        if (ROBOT.passes < 2){ ROBOT.path = robotWaypoints(); ROBOT.pathI = 0; } // 掃多一轉（重新洗牌）先返基站
        else robotStartReturn();
      }
      return;
    }
    const targetA = Math.atan2(dx, dz);
    ROBOT.heading = dampAngle(ROBOT.heading, targetA, 3.2, dt);
    if (!isFinite(ROBOT.heading)) ROBOT.heading = 0; // NaN 防線：heading 一壞，追車/坐車嘅貓會跟住消失
    g.rotation.y = ROBOT.heading;
    const diff = Math.abs(((targetA - ROBOT.heading + Math.PI)%TAU+TAU)%TAU - Math.PI);
    const gateLeg = !!tp.g || (ROBOT.state === 'returning' && ROBOT.pathI >= ROBOT.path.length); // 閘口路段（出入基站嗰幾步，連最後入泊嗰段）：慢行 + 對準先行，唔好大弧度掃彎掂到塔角/飲水機/貓窩
    // 避貓（唔係騎緊嗰陣）：貓喺地又喺前面近距離 → 停低等佢；貼得太近就成架車退返開，唔好轆穿隻貓
    let catBlock = false;
    if (!S.riding && catRoot.position.y < 0.05){
      const cdx = catRoot.position.x - g.position.x, cdz = catRoot.position.z - g.position.z;
      const cd = Math.hypot(cdx, cdz);
      if (cd < 0.48){
        if (cd > 0.001){ g.position.x = catRoot.position.x - cdx/cd*0.48; g.position.z = catRoot.position.z - cdz/cd*0.48; }
        catBlock = true;
      } else if (cd < 0.66){
        const ahead = (Math.sin(ROBOT.heading)*cdx + Math.cos(ROBOT.heading)*cdz) / cd;
        if (ahead > 0.2) catBlock = true; // 貓喺正前面 → 等
      }
    }
    if (catBlock){
      ROBOT.blockT = (ROBOT.blockT || 0) + dt;
      if (ROBOT.blockT > 5 && ROBOT.state === 'patrol'){ // 等太耐：跳去下一個路點兜路（返基站嗰程唔跳，唔好亂咗入閘路線）
        ROBOT.blockT = 0; ROBOT.pathI++;
        if (ROBOT.pathI >= ROBOT.path.length){ ROBOT.passes++; if (ROBOT.passes < 2){ ROBOT.path = robotWaypoints(); ROBOT.pathI = 0; } else robotStartReturn(); }
      }
    } else ROBOT.blockT = 0;
    if (!catBlock && diff < (gateLeg ? 0.3 : 0.6)){ const sp = ROBOT.speed * (gateLeg ? 0.55 : 1); g.position.x += Math.sin(ROBOT.heading) * sp * dt; g.position.z += Math.cos(ROBOT.heading) * sp * dt; }
    if (ROBOT.t > 110 && ROBOT.state === 'patrol') robotStartReturn(); // 每次出巡兩轉路點，上限約 110 秒
  }
}

/* ---------------- 窗外雀仔 ---------------- */
const BIRDS = { list: [], present: false, nextEvent: 26, noticed: false, chatterT: 2 };
// 雀仔只准喺窗框幅畫入面飛：winG 喺後牆內面（世界 z=-4.48），框內闊 ±1.255、
// 高 ±0.9；以前生成/飛走用 ±1.9，雀仔會沿住室內幅牆飛 → 飛咗入室內。
// BIRD_EDGE = 生成/目標嘅最大 |x|（飛緊半長約 0.13，翼尖唔過框邊）；BIRD_Z = 雀仔層，貼返玻璃面。
const BIRD_EDGE = 1.08, BIRD_Z = 0.02;
function makeBird(color){
  const g = new THREE.Group();
  const bm = MAT.std(color, 0.9);
  const body = sph(0.05, bm, 0, 0, 0, g); body.scale.set(0.9, 0.85, 1.5); body.castShadow = false;
  const head = sph(0.032, bm, 0, 0.028, 0.062, g); head.castShadow = false;
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.011, 0.035, 8), MAT.std(0xe8a33e, 0.6));
  beak.rotation.x = Math.PI/2; beak.position.set(0, 0.026, 0.105); g.add(beak);
  const tail = box(0.05, 0.008, 0.07, bm, 0, 0.012, -0.095, g); tail.rotation.x = -0.35; tail.castShadow = false;
  const wings = [];
  [-1,1].forEach(s=>{ const wp = new THREE.Group(); wp.position.set(0.035*s, 0.025, 0.01); g.add(wp);
    const w = box(0.17, 0.008, 0.075, bm, 0.085*s, 0, 0, wp); w.castShadow = false; wings.push(wp); });
  g.visible = false;
  g.userData = { wings, head, mode:'away', t:0, from:new THREE.Vector3(), to:new THREE.Vector3(), dur:1, stay:0, hopT:1, done:null };
  world.userData.winG.add(g); return g;
}
BIRDS.list = [makeBird(0x9a7b5f), makeBird(0x7f9fb8), makeBird(0xd8b34a)];
function birdFlyTo(b, to, dur, done){ const u = b.userData; u.from.copy(b.position); u.to.copy(to); u.t = 0; u.dur = dur; u.mode = 'fly'; u.done = done || null; b.visible = true; }
function startBirdEvent(){
  BIRDS.noticed = false;
  if (Math.random() < 0.55){ // 一隻停喺窗邊
    const b = BIRDS.list[0], side = Math.random() < 0.5 ? -1 : 1;
    b.position.set(BIRD_EDGE*side, 0.55, BIRD_Z);
    birdFlyTo(b, new THREE.Vector3(rand(-0.75, 0.75), -0.80, BIRD_Z), rand(1.1, 1.5), ()=>{ b.userData.mode = 'perched'; b.userData.stay = rand(7, 13); b.userData.hopT = rand(0.8, 2); });
  } else { // 一群飛過

function updateBirds(dt){
  let anyVisible = false;
  for (const b of BIRDS.list){
    if (!b.visible) continue; anyVisible = true;
    // 安全網：無論邊條路徑，雀仔位置都鉗死喺窗框範圍＋玻璃層，唔准入房
    b.position.x = clamp(b.position.x, -1.15, 1.15);
    b.position.y = clamp(b.position.y, -0.85, 0.85);
    b.position.z = BIRD_Z;
    const u = b.userData;
    const flap = u.mode === 'fly' ? Math.sin(performance.now()*0.09)*0.95 : (u.mode === 'perched' ? 0.55 : 0.12);
    u.wings[0].rotation.z = flap; u.wings[1].rotation.z = -flap;
    if (u.mode === 'fly'){
      u.t += dt / u.dur; const t = Math.min(1, u.t);
      b.position.lerpVectors(u.from, u.to, t);
      b.position.y += Math.sin(t * Math.PI * 3) * 0.012;
      b.rotation.y = u.to.x > u.from.x ? Math.PI/2 : -Math.PI/2;
      if (t >= 1){ const d = u.done; u.done = null; u.mode = 'idle'; if (d) d(); }
    } else if (u.mode === 'perched'){
      u.stay -= dt; u.hopT -= dt;
      if (u.hopT <= 0){ u.hopT = rand(0.9, 2.4);
        if (Math.random() < 0.45){ b.position.x = clamp(b.position.x + rand(-0.3, 0.3), -1.05, 1.05); b.position.y = -0.75; after(0.16, ()=>{ b.position.y = -0.80; }); }
        else { u.head.rotation.x = 0.7; after(0.22, ()=>{ u.head.rotation.x = 0; }); }
        b.rotation.y = rand(-0.7, 0.7);

  if (!anyVisible){ BIRDS.nextEvent -= dt; if (BIRDS.nextEvent <= 0){ BIRDS.nextEvent = rand(40, 85); startBirdEvent(); } }

}

const ZOOM = { on: false, t: 0, dur: 0, wpi: 0,
  path: [ {x:-3.4,z:-2.3}, {x:0.6,z:-2.7}, {x:3.1,z:-1.5}, {x:3.0,z:2.4}, {x:0.8,z:3.0}, {x:-2.4,z:2.7}, {x:-3.8,z:0.5} ] }; // 環形路線（已避開全部傢俬腳印）
function updateZoomies(dt){
  if (!ZOOM.on) return;
  if (S.activity !== 'zoomies' || FETCH.active || S.toyMode){ ZOOM.on = false; CAT.tailStream = false; CAT.zoomRoll = 0; return; } // 俾其他活動/玩具打斷 → 收尾
  ZOOM.t += dt;
  const p = catRoot.position;
  if (ZOOM.t >= ZOOM.dur){ // 突然停低，當咩事都冇發生過
    ZOOM.on = false; CAT.tailStream = false; CAT.zoomRoll = 0; CAT.speed = 0;
    S.energy = clamp(S.energy - 14, 0, 100);
    if (Math.random() < 0.55){ CAT.pose = 'sit'; setActivity('idle', rand(2.5, 4)); }
    else { CAT.pose = 'groom'; setActivity('groom', rand(3, 4.5)); }
    showBubble(pick(['呼…呼…', '咩事都冇發生過 😼', '跑完，爽！']), 1300);
    return;
  }
  const tp = ZOOM.path[ZOOM.wpi];
  const dx = tp.x - p.x, dz = tp.z - p.z, d = Math.hypot(dx, dz);
  if (d < 0.55) ZOOM.wpi = (ZOOM.wpi + 1) % ZOOM.path.length;
  const prevHeading = CAT.heading;
  CAT.heading = dampAngle(CAT.heading, Math.atan2(dx, dz), 4.2, dt);
  catRoot.rotation.y = CAT.heading;
  const turn = ((CAT.heading - prevHeading + Math.PI) % TAU + TAU) % TAU - Math.PI;
  CAT.zoomRoll = clamp(-turn * 2.2, -0.26, 0.26); // 轉彎嗰陣成身側側哋（skid 感）
  CAT.speed = damp(CAT.speed, 2.7, 5, dt);
  p.x += Math.sin(CAT.heading) * CAT.speed * dt;
  p.z += Math.cos(CAT.heading) * CAT.speed * dt;
  for (const o of OBSTACLES){ // 同平時行路同一套避障，唔好穿傢俬
    const ox = p.x - o.x, oz = p.z - o.z, od = Math.hypot(ox, oz);
    if (od < o.r + 0.05 && od > 0.001){ p.x = o.x + ox/od*(o.r + 0.05); p.z = o.z + oz/od*(o.r + 0.05); }
  }
  if (!S.riding){
    const rp = ROBOT.group.position, rox = p.x - rp.x, roz = p.z - rp.z, rod = Math.hypot(rox, roz);
    if (rod < 0.45 && rod > 0.001){ p.x = rp.x + rox/rod*0.45; p.z = rp.z + roz/rod*0.45; }
  }
  p.x = clamp(p.x, -5.15, 5.15); p.z = clamp(p.z, -4.15, 4.25);
  CAT.moving = true;
}

const DAYSETS = {
  morning: { sun:0xffd9a8, sunI:1.35, hemi:0.75, sky:0xaadcf7, lamp:0.0, bg:0x3a2c1e },
  day:     { sun:0xfff2d8, sunI:1.6,  hemi:0.9,  sky:0x8fd0f7, lamp:0.0, bg:0x3a2c1e },
  golden:  { sun:0xffbe78, sunI:1.25, hemi:0.65, sky:0xf7b06a, lamp:0.35, bg:0x38281c },
  evening: { sun:0x8fa3cc, sunI:0.4,  hemi:0.42, sky:0x35406e, lamp:1.1, bg:0x241c26 },
  night:   { sun:0x7488bb, sunI:0.22, hemi:0.3,  sky:0x1d2440, lamp:1.35, bg:0x1c1622 },
};
function dayPhase(){
  if (SAVE.dayMode === 'day') return 'day';
  if (SAVE.dayMode === 'night') return 'night';
  const h = hourNow();
  if (h >= 6.5 && h < 9.5) return 'morning';
  if (h >= 9.5 && h < 16.5) return 'day';
  if (h >= 16.5 && h < 19.5) return 'golden';
  if (h >= 19.5 && h < 22.5) return 'evening';
  return 'night';
}
const lightCur = { sunI: 1.4, hemi: 0.8, lamp: 0, sunC: new THREE.Color(0xfff2d8), skyC: new THREE.Color(0x8fd0f7), bgC: new THREE.Color(0x3a2c1e) };
function updateLighting(dt){
  const T = DAYSETS[dayPhase()];
  lightCur.sunI = damp(lightCur.sunI, T.sunI, 2, dt);
  lightCur.hemi = damp(lightCur.hemi, T.hemi, 2, dt);
  lightCur.lamp = damp(lightCur.lamp, T.lamp, 2, dt);
  lightCur.sunC.lerp(new THREE.Color(T.sun), 1 - Math.exp(-2*dt));
  lightCur.skyC.lerp(new THREE.Color(T.sky), 1 - Math.exp(-2*dt));
  lightCur.bgC.lerp(new THREE.Color(T.bg), 1 - Math.exp(-2*dt));
  sun.intensity = lightCur.sunI; sun.color.copy(lightCur.sunC);
  hemi.intensity = lightCur.hemi;
  lampLight.intensity = lightCur.lamp * 14;
  world.userData.sky.material.color.copy(lightCur.skyC);
  world.userData.lampShade.material.emissiveIntensity = 0.12 + lightCur.lamp * 0.9;
  scene.background.copy(lightCur.bgC);
  // 飲水機水面輕輕閃
  if (world.userData.fountain) world.userData.fountain.userData.water.position.y = 0.185 + Math.sin(performance.now()*0.0022)*0.0022;
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pickables = [CAT.headMesh, CAT.bodyMesh];
CAT.headMesh.userData.part = 'head'; CAT.bodyMesh.userData.part = 'body';
let pDown = null, stroking = false, strokeAcc = 0, lastStrokePos = null;
function castAt(cx, cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  return hits[0] || null;
}
function floorPoint(cx, cy){
  ndc.set((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
  const out = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, out) ? out : null;
}

el.style.touchAction = 'none';
el.addEventListener('pointerdown', e=>{
  ensureAudio();
  pDown = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
  stroking = false; strokeAcc = 0; lastStrokePos = null;
  if (S.toyMode){ const fp = floorPoint(e.clientX, e.clientY); if (fp) toyTarget.set(clamp(fp.x,-5,5), 0, clamp(fp.z,-4.1,4.2)); }
  else { const hit = castAt(e.clientX, e.clientY); if (hit){ stroking = true; lastStrokePos = {x:e.clientX, y:e.clientY}; } }

el.addEventListener('pointermove', e=>{
  if (!pDown) return;
  const dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  pDown.moved = Math.max(pDown.moved, Math.hypot(dx, dy));
  if (S.toyMode){ const fp = floorPoint(e.clientX, e.clientY); if (fp) toyTarget.set(clamp(fp.x,-5,5), 0, clamp(fp.z,-4.1,4.2)); return; }
  if (stroking && lastStrokePos){
    strokeAcc += Math.hypot(e.clientX - lastStrokePos.x, e.clientY - lastStrokePos.y);
    lastStrokePos = { x: e.clientX, y: e.clientY };
    if (strokeAcc > 85){

      const hit = castAt(e.clientX, e.clientY);

function takePhoto(){
  renderer.render(scene, camera); // 即刻 render 一幀再擷取，唔使 preserveDrawingBuffer（單一檔案/手機都得）
  const src = renderer.domElement;
  const W = 480, H = Math.round(W * src.height / Math.max(1, src.width));
  const pad = 16, capH = 46;
  const cv = document.createElement('canvas'); cv.width = W + pad * 2; cv.height = H + pad + capH;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fffaf0'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.save();
  if (cx.roundRect){ cx.beginPath(); cx.roundRect(pad, pad, W, H, 12); cx.clip(); }
  cx.drawImage(src, pad, pad, W, H);
  cx.restore();
  const d = new Date();
  cx.fillStyle = '#5a3a1a'; cx.font = '700 21px sans-serif'; cx.textAlign = 'center';
  cx.fillText(`花喵喵 · ${d.getDate()}/${d.getMonth() + 1} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, cv.width / 2, H + pad + 31);
  SAVE.album = SAVE.album || [];
  SAVE.album.unshift({ img: cv.toDataURL('image/jpeg', 0.82), t: Date.now() });
  if (SAVE.album.length > 12) SAVE.album.length = 12; // 最多 12 張，最新喺前
  persist(); sfx.pop(); toast('📸 影咗！存入相簿');
  openAlbum(0);
}
