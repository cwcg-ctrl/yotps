<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes AI 系統狀態</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #1e3a8a, #7c3aed, #db2777, #f59e0b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-down { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .card-label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #334155;
            white-space: pre-line;
            line-height: 1.55;
            word-break: break-word;
        }
    </style>
</head>
<body class="p-4">
    <div class="glass-panel shadow-2xl p-6 md:p-8 max-w-lg w-full">
        <header class="text-center mb-6">
            <div class="text-5xl mb-3">🤖</div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight mb-2">
                Hermes AI 系統狀態
            </h1>
            <div class="h-1 w-12 bg-indigo-500 mx-auto rounded-full opacity-80"></div>
        </header>

        <div class="space-y-3">
            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="card-label">系統狀態</div>
                <div class="flex items-center">
                    <span id="status-dot" class="status-dot status-ok"></span>
                    <span id="status-text" class="text-lg font-bold text-slate-800">—</span>
                </div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="card-label">最後更新時間</div>
                <div id="last-updated" class="text-base font-mono text-slate-800">—</div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                    <div class="card-label">模型</div>
                    <div id="model" class="card-value">—</div>
                </div>
                <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                    <div class="card-label">Gateway</div>
                    <div id="gateway" class="card-value">—</div>
                </div>
                <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                    <div class="card-label">上次備份</div>
                    <div id="backup" class="card-value">—</div>
                </div>
                <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                    <div class="card-label">磁碟空間</div>
                    <div id="disk" class="card-value">—</div>
                </div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="card-label">最近錯誤（24 小時）</div>
                <div id="errors" class="card-value">—</div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="card-label">最近工作</div>
                <div id="recent-work" class="card-value">—</div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-slate-400 text-[10px] font-semibold uppercase tracking-widest">
                Powered by Hermes AI · 每 1 小時自動更新
            </p>
        </div>
    </div>

    <script type="application/json" id="status-data">{"last_updated": "2026-11-14T00:00:58+08:00", "model": "meituan/longcat-2.5:free", "gateway": "running（3 個 agent 活躍）", "backup": "2026-11-13_0530（36 MB，18 小時前）", "disk": "C: 82% 用咗，剩 12.3 GB\nE: 10% 用咗，剩 97.1 GB", "errors": "連線協議錯誤 5 次（最後 11-13 17:13）\nRate limit（429，upstream 容量） 3 次（最後 11-13 14:20）\nError analyzing image: Error code: N - {'stat… ×6（最後 11-13 18:09）", "recent_work": "• hk-science-games/_v7_build.py（4 分鐘前）\n• hk-science-games/v6_path_mockup.html（30 分鐘前）\n• phase2：docs: add AGENTS.md project conventions（2 日前）\n• 排程 8/9 啟用，8 個上次正常"}</script>
    <script>
        let d = {};
        try {
            d = JSON.parse(document.getElementById('status-data').textContent);
        } catch (e) {
            d = {};
        }

        const set = (id, val) => {
            const el = document.getElementById(id);
            if (el && val !== undefined && val !== null && val !== '') el.textContent = val;
        };

        set('model', d.model);
        set('gateway', d.gateway);
        set('backup', d.backup);
        set('disk', d.disk);
        set('errors', d.errors);
        set('recent-work', d.recent_work);
        set('last-updated', d.last_updated);

        // 系統狀態：最後更新超過 90 分鐘 → 判為斷線
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        const t = d.last_updated ? new Date(d.last_updated) : null;
        const valid = t && !isNaN(t.getTime());
        const ageMin = valid ? (Date.now() - t.getTime()) / 60000 : Infinity;

        if (!valid || ageMin > 90) {
            const hrs = valid ? (ageMin / 60).toFixed(1) : '未知';
            txt.textContent = valid
                ? '✗ 系統斷線（已 ' + hrs + ' 小時冇更新）'
                : '✗ 系統斷線（讀不到最後更新時間）';
            dot.className = 'status-dot status-down';
        } else {
            txt.textContent = '✓ 系統正常（' + Math.round(ageMin) + ' 分鐘前更新）';
            dot.className = 'status-dot status-ok';
        }
    </script>
</body>
</html>
