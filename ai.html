<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes AI 系統狀態</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(-45deg, #1e3a8a, #7c3aed, #db2777, #f59e0b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-down { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    </style>
</head>
<body class="p-4">
    <div class="glass-panel shadow-2xl p-6 md:p-8 max-w-lg w-full">
        <header class="text-center mb-6">
            <div class="text-5xl mb-3">🤖</div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight mb-2">
                Hermes AI 系統狀態
            </h1>
            <div class="h-1 w-12 bg-indigo-500 mx-auto rounded-full opacity-80"></div>
        </header>

        <div class="space-y-4">
            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-1">系統狀態</div>
                <div class="flex items-center">
                    <span id="status-dot" class="status-dot status-ok"></span>
                    <span id="status-text" class="text-lg font-bold text-slate-800">✓ 系統正常</span>
                </div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-1">最後更新時間</div>
                <div id="last-updated" class="text-lg font-mono text-slate-800">---</div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-1">模型</div>
                <div id="model" class="text-sm font-mono text-slate-700">---</div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-1">Gateway</div>
                <div id="gateway" class="text-sm font-mono text-slate-700">---</div>
            </div>

            <div class="bg-white/70 rounded-xl p-4 border border-white shadow-sm">
                <div class="text-xs text-slate-500 uppercase tracking-widest mb-1">上次備份</div>
                <div id="backup" class="text-sm font-mono text-slate-700">---</div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-slate-400 text-[10px] font-semibold uppercase tracking-widest">
                Powered by Hermes AI
            </p>
        </div>
    </div>

    <script>
        // 最後更新時間
        const lastUpdated = "2026-11-12T02:30:18+08:00";
        document.getElementById('last-updated').textContent = lastUpdated;

        // 模型
        document.getElementById('model').textContent = "meituan/longcat-2.5:free";

        // Gateway
        document.getElementById('gateway').textContent = "running";

        // 上次備份
        document.getElementById('backup').textContent = "2026-11-12 01:37 HKT";

        // 判斷系統狀態（45 分鐘）
        const lastUpdatedDate = new Date(lastUpdated);
        const now = new Date();
        const diffMinutes = (now - lastUpdatedDate) / 1000 / 60;

        if (diffMinutes > 45) {
            document.getElementById('status-text').textContent = "✓ 系統正常";
            document.getElementById('status-dot').className = "status-dot status-ok";
        } else {
            document.getElementById('status-text').textContent = "✓ 系統正常";
            document.getElementById('status-dot').className = "status-dot status-ok";
        }
    </script>
</body>
</html>
