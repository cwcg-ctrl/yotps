name: Check AI Status

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = HKT 08:00
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check last updated
        id: check
        run: |
          LAST_UPDATED=$(grep -oP 'const lastUpdated = "\K[^"]+' ai.html)
          echo "Last updated: $LAST_UPDATED"
          
          if [ -z "$LAST_UPDATED" ]; then
            echo "status=down" >> $GITHUB_OUTPUT
            echo "::warning::Cannot find lastUpdated in ai.html"
            exit 0
          fi
          
          LAST_EPOCH=$(date -d "$LAST_UPDATED" +%s)
          NOW_EPOCH=$(date +%s)
          DIFF=$((NOW_EPOCH - LAST_EPOCH))
          
          echo "Diff: $DIFF seconds ($((DIFF / 3600)) hours)"
          
          if [ $DIFF -gt 2700 ]; then
            echo "status=down" >> $GITHUB_OUTPUT
            echo "::warning::AI status page has not been updated for more than 24 hours"
          else
            echo "status=ok" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if down
        if: steps.check.outputs.status == 'down'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ AI 系統狀態：超過 24 小時未更新',
              body: 'ai.html 嘅「最後更新時間」已超過 24 小時，可能系統斷線。請檢查。\n\n最後更新時間：' + new Date().toISOString()
            })
